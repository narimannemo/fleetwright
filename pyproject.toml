[project]
name = "superagentic"
dynamic = ["version"]
description = "Work leases in one SQLite file, so a fleet of agents divides a job list instead of racing it. Library, CLI and MCP server, zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "work-queue", "lease", "sqlite", "mcp", "distributed",
            "coordination", "fleet", "task-queue", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
]

# None, on purpose. This gets installed next to whatever the workers actually
# run, and the least it can do is have no opinion about their dependency
# versions. The CLI is argparse and the MCP server is json + stdio.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/narimannemo/superagentic"
Documentation = "https://github.com/narimannemo/superagentic/tree/main/docs"
Issues = "https://github.com/narimannemo/superagentic/issues"
Changelog = "https://github.com/narimannemo/superagentic/blob/main/CHANGELOG.md"

[project.scripts]
superagentic = "superagentic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-sourced from the package. Two hand-maintained version strings drift,
# and the failure is a wheel whose metadata disagrees with what the code
# reports -- visible only to whoever debugs it later.
[tool.hatch.version]
path = "src/superagentic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/superagentic"]

[tool.hatch.build.targets.sdist]
# Everything the README links to must be in here, or the doc tests fail inside
# the sdist -- which is the point of running them there. The repo and the
# tarball are different filesystems and only one of them is what users get.
include = ["src/superagentic", "tests", "examples", "docs", "packaging",
           "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
