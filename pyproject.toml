[project]
name = "fleetwright"
dynamic = ["version"]
description = "Work leases in one SQLite file, so a fleet of agents divides a job list instead of racing it. Library, CLI and MCP server, zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "work-queue", "lease", "sqlite", "mcp", "distributed",
            "coordination", "fleet", "task-queue", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    # Every version CI actually tests. Listing only 3.11 made the
    # pyversions badge read "3.11", which understates support and is exactly
    # the sort of thing that makes someone on 3.13 not try it.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
]

# None, on purpose. This gets installed next to whatever the workers actually
# run, and the least it can do is have no opinion about their dependency
# versions. The CLI is argparse and the MCP server is json + stdio.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/narimannemo/fleetwright"
Documentation = "https://github.com/narimannemo/fleetwright/tree/main/docs"
Issues = "https://github.com/narimannemo/fleetwright/issues"
Changelog = "https://github.com/narimannemo/fleetwright/blob/main/CHANGELOG.md"

[project.scripts]
fleetwright = "fleetwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-sourced from the package. Two hand-maintained version strings drift,
# and the failure is a wheel whose metadata disagrees with what the code
# reports -- visible only to whoever debugs it later.
[tool.hatch.version]
path = "src/fleetwright/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetwright"]

# The skill ships INSIDE the package, not beside it. `install-skill` writes it
# into a project at runtime, so it has to be importable from a wheel; and one
# copy means it cannot drift from the CLI it documents, which is a class of bug
# this project has already hit more than once.
[tool.hatch.build.targets.wheel.force-include]
"src/fleetwright/skill/SKILL.md" = "fleetwright/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
# Everything the README links to must be in here, or the doc tests fail inside
# the sdist -- which is the point of running them there. The repo and the
# tarball are different filesystems and only one of them is what users get.
# `ee/` is deliberately absent. It is not Apache-2.0, and shipping a
# differently-licensed directory inside an Apache-2.0 wheel is how a licence
# question becomes a licence problem. The published package is Apache-2.0
# throughout.
include = ["src/fleetwright", "tests", "examples", "docs", "packaging",
           "assets", "bench", "README.md", "LICENSE", "LICENSING.md",
           "CHANGELOG.md", "CONTRIBUTING.md"]
# `include` is not enough. Hatchling collects licence files from anywhere in
# the tree as metadata, so ee/LICENSE landed in the sdist even though `ee` was
# never listed. An explicit exclude is what actually keeps it out — verified by
# inspecting the built tarball, not by reading this file.
exclude = ["ee", "ee/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
