name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:          # the release workflow reuses this rather than
                          # duplicating it, so a tag cannot ship something
                          # the matrix never ran.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          # macOS and Windows are not paranoia. This library depends on SQLite
          # locking behaviour and on subprocess semantics, and both differ
          # across platforms in ways only a runner finds.
          - { os: macos-latest,   python: "3.11" }
          - { os: windows-latest, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system ".[dev]"
      - run: ruff check .
      # Not `run: pytest -q`. Workflow LOGS need a token to read, so a
      # failure on a runner you do not have is "Process completed with exit
      # code 1" and nothing else. Annotations are public. Emitting the tail of
      # the output as one turns a guessing game into a bug report.
      - name: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short > pytest.out 2>&1
          code=$?
          cat pytest.out
          if [ $code -ne 0 ]; then
            msg=$(tail -60 pytest.out | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest failed on ${{ matrix.os }} py${{ matrix.python }}::$msg"
          fi
          exit $code
      - run: fleetwright demo
      - name: the dashboard renders and is self-contained
        shell: bash
        run: |
          fleetwright add smoke a b c --db smoke.db
          fleetwright dashboard --db smoke.db --out smoke.html
          grep -q "fleetwright" smoke.html
          # A CDN reference here would mean the snapshot is useless offline or
          # under a strict CSP, which is most of where it will be opened.
          ! grep -qE '(src|href)="https?://' smoke.html
      - name: a real four-worker fleet, end to end
        shell: bash
        run: |
          fleetwright define work --db ci.db \
            --instructions 'Process $name from $root' \
            --done-when 'it is processed' --returns '{"ok": true}'
          python -c "print('\n'.join(f'u{i}' for i in range(40)))" > units.txt
          fleetwright add work --from-file units.txt --db ci.db \
            --meta '{"root": "/tmp/$name"}'
          # The brief must reach a worker with the templating resolved, on
          # every platform. This is where a Windows encoding difference would
          # show up as a name that no longer matches.
          fleetwright claim work --db ci.db --brief --worker probe | tee brief.txt
          grep -q "Process u0 from /tmp/u0" brief.txt
          grep -q "DONE WHEN" brief.txt
          fleetwright release work:u0 --db ci.db --worker probe
          for _ in 1 2 3 4; do
            ( while u=$(fleetwright claim work --json --db ci.db); do
                id=$(python -c "import json,sys;print(json.loads(sys.argv[1])[0]['unit_id'])" "$u")
                fleetwright done "$id" --db ci.db >/dev/null
              done ) &
          done
          wait
          fleetwright status --db ci.db
          python - <<'PY'
          import fleetwright as sa
          p = sa.progress(sa.connect("ci.db"))["work"]
          assert p["done"] == 40 and p["open"] == 0, p
          print("40/40 done, no duplicates")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - name: the package must be Apache-2.0 throughout
        run: |
          # ee/ is not Apache-2.0. Shipping it inside an Apache-2.0 wheel is
          # how a licence question becomes a licence problem for someone who
          # never looked at the repository.
          ! tar -tzf dist/*.tar.gz | grep "/ee/"
          ! unzip -l dist/*.whl | grep -E "(^| )ee/"
          echo "no ee/ in either artefact"
      - name: the sdist must be able to test itself
        run: |
          mkdir -p /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          uv pip install --system ".[dev]"
          pytest -q
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
